<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anniversary untuk Amel</title>
<style>
:root { --pink:#ff6fae; --text:#5b2440; --soft:#ffe4ef; }
* { box-sizing:border-box; }
body { margin:0; font-family:"Segoe UI",Arial,sans-serif; background:radial-gradient(circle at top left,#fff 0,transparent 32%),linear-gradient(135deg,#ffe3ef,#fff8fc 48%,#ffeaf3); color:var(--text); min-height:100vh; overflow-x:hidden; }
.page { width:min(920px,92%); margin:0 auto; padding:32px 0 130px; }
.screen { min-height:100vh; display:none; align-items:center; justify-content:center; text-align:center; animation:fade .7s ease both; }
.screen.active { display:flex; }
.card { width:min(760px,100%); background:rgba(255,255,255,.72); border:1px solid rgba(255,255,255,.9); border-radius:28px; padding:34px 24px; box-shadow:0 20px 60px rgba(255,111,174,.18); backdrop-filter:blur(12px); }
h1 { font-size:clamp(2rem,6vw,4.2rem); line-height:1.05; margin:0 0 12px; }
h2 { font-size:clamp(1.6rem,4vw,2.4rem); margin:0 0 16px; }
p { font-size:clamp(1rem,2.4vw,1.18rem); line-height:1.75; margin:8px 0; }
.subtitle { opacity:.82; margin-bottom:26px; }
button { border:0; border-radius:999px; padding:13px 24px; background:linear-gradient(135deg,#ff6fae,#ff9bc7); color:white; font-size:1rem; font-weight:650; cursor:pointer; box-shadow:0 10px 26px rgba(255,111,174,.28); transition:transform .2s ease,box-shadow .2s ease; }
button:hover { transform:translateY(-2px); box-shadow:0 14px 32px rgba(255,111,174,.36); }

.audio-player { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); width:min(420px,92%); padding:12px 14px; background:rgba(255,255,255,.90); border:1px solid rgba(255,255,255,.95); border-radius:22px; box-shadow:0 14px 34px rgba(91,36,64,.18); z-index:100; backdrop-filter:blur(12px); display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; }
.audio-btn { width:46px; height:46px; padding:0; display:grid; place-items:center; font-size:1.1rem; }
.audio-info { text-align:left; min-width:0; }
.audio-title { font-size:.9rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.audio-status { font-size:.78rem; opacity:.7; margin-top:2px; }
.progress-wrap { grid-column:1/4; height:7px; background:#ffe0ec; border-radius:999px; overflow:hidden; cursor:pointer; }
.progress { width:0%; height:100%; background:linear-gradient(90deg,#ff6fae,#ff9bc7); border-radius:999px; }
.time { font-size:.75rem; opacity:.68; }

.letter { min-height:170px; display:flex; align-items:center; justify-content:center; padding:18px; border-radius:22px; background:rgba(255,247,251,.9); margin:20px 0 12px; }
.letter p { font-size:clamp(1.08rem,3vw,1.42rem); }
.progress-text { font-size:.9rem; opacity:.7; margin-bottom:18px; }
.gallery { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:22px; }
.gallery img { width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:22px; box-shadow:0 12px 28px rgba(91,36,64,.12); transition:transform .3s ease; background:#ffe4ef; cursor:pointer; }
.gallery img:hover { transform:scale(1.045); }
.lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,.84); justify-content:center; align-items:center; z-index:200; padding:18px; }
.lightbox img { max-width:92%; max-height:86%; border-radius:20px; box-shadow:0 16px 50px rgba(0,0,0,.35); }
.lightbox span { position:fixed; top:18px; right:24px; color:white; font-size:2rem; cursor:pointer; }
.quiz-options { display:grid; gap:12px; margin-top:18px; }
.final-text { font-size:clamp(1.2rem,3vw,1.55rem); font-weight:600; }
.heart { position:fixed; top:110%; color:rgba(255,111,174,.6); animation:floatHeart linear forwards; pointer-events:none; z-index:0; }
@keyframes fade { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
@keyframes floatHeart { to { transform:translateY(-120vh) rotate(28deg); opacity:0; } }
@media (max-width:650px) { .card{padding:28px 18px;border-radius:24px;} .gallery{grid-template-columns:1fr;} button{padding:12px 18px;} .audio-player{grid-template-columns:auto 1fr;}.time{display:none}.progress-wrap{grid-column:1/3;} }
</style>
</head>
<body>
<audio id="bgMusic" loop preload="metadata"></audio>

<div class="audio-player">
  <button class="audio-btn" id="playBtn">▶</button>
  <div class="audio-info">
    <div class="audio-title">Musik latar</div>
    <div class="audio-status" id="audioStatus">Tekan play jika belum otomatis berjalan</div>
  </div>
  <div class="time" id="timeText">0:00</div>
  <div class="progress-wrap" id="progressWrap"><div class="progress" id="progressBar"></div></div>
</div>

<section class="screen active" id="coverScreen"><div class="page"><div class="card"><h1 id="coverTitle"></h1><p class="subtitle" id="coverSubtitle"></p><button id="openBtn">Buka Surat</button></div></div></section>
<section class="screen" id="letterScreen"><div class="page"><div class="card"><h2>Surat kecil untukmu</h2><div class="letter"><p id="letterText"></p></div><div class="progress-text" id="letterProgress"></div><button id="nextLetterBtn">Lanjut</button></div></div></section>
<section class="screen" id="galleryScreen"><div class="page"><div class="card"><h2>Galeri Kenangan Kita</h2><p>Klik foto untuk melihat lebih dekat.</p><div class="gallery" id="gallery"></div><br><button id="toQuizBtn">Lanjut ke Kuis</button></div></div></section>
<div class="lightbox" id="lightbox"><span id="closeLightbox">×</span><img id="lightboxImg" alt="Foto besar"></div>
<section class="screen" id="quizScreen"><div class="page"><div class="card"><h2>Mini Kuis</h2><p id="quizQuestion"></p><div class="quiz-options" id="quizOptions"></div><p id="quizFeedback"></p></div></div></section>
<section class="screen" id="finalScreen"><div class="page"><div class="card"><h2 id="finalTitle"></h2><p class="final-text" id="finalMessage"></p></div></div></section>

<script>
const CONFIG = {
  judul: "Selamat Anniversary, Amel ❤️",
  subjudul: "Untuk seseorang yang paling berarti dalam hari-hariku.",
  pesanSurat: [
    "Amel, terima kasih sudah hadir dan bertahan sejauh ini bersamaku.",
    "Bersamamu, banyak hal sederhana terasa lebih hangat dan berarti.",
    "Aku tahu hubungan tidak selalu sempurna, tetapi aku selalu ingin belajar menjadi lebih baik untuk kita.",
    "Semoga kita terus saling menjaga, saling memahami, dan tumbuh bersama dengan cara yang paling baik.",
    "Selamat anniversary, sayang. Aku bersyukur punya kamu."
  ],
  foto: ["images/foto1.jpg","images/foto2.jpg","images/foto3.jpg"],
  musik: "music/lagu.mp3",
  kuis: {
    pertanyaan: "Apa hal yang paling aku syukuri dari hubungan ini?",
    pilihan: ["Bisa jalan-jalan", "Punya kamu", "Bisa makan bareng"],
    jawabanBenar: 1,
    pesanBenar: "Benar. Jawabannya selalu kamu.",
    pesanSalah: "Belum tepat. Coba pilih dengan hati."
  },
  penutupJudul: "Untuk Amel",
  penutupPesan: "Semoga hari ini menjadi pengingat bahwa kamu adalah salah satu bagian paling indah dalam hidupku."
};

const version = new Date().getTime();
const music = document.getElementById("bgMusic");
music.src = CONFIG.musik + "?v=" + version;

const screens = { cover:coverScreen, letter:letterScreen, gallery:galleryScreen, quiz:quizScreen, final:finalScreen };
let letterIndex = 0;
let typingTimer = null;

function showScreen(name){
  Object.values(screens).forEach(s=>s.classList.remove("active"));
  screens[name].classList.add("active");
}

function formatTime(sec){
  if (!isFinite(sec)) return "0:00";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2,"0");
  return m + ":" + s;
}

function updatePlayer(){
  playBtn.textContent = music.paused ? "▶" : "❚❚";
  audioStatus.textContent = music.paused ? "Musik dijeda" : "Musik sedang berjalan";
  const percent = music.duration ? (music.currentTime / music.duration) * 100 : 0;
  progressBar.style.width = percent + "%";
  timeText.textContent = formatTime(music.currentTime);
}

playBtn.onclick = () => {
  if (music.paused) music.play().catch(()=>{ audioStatus.textContent = "Tekan play sekali lagi"; });
  else music.pause();
};
music.addEventListener("play", updatePlayer);
music.addEventListener("pause", updatePlayer);
music.addEventListener("timeupdate", updatePlayer);
progressWrap.onclick = (e) => {
  if (!music.duration) return;
  const rect = progressWrap.getBoundingClientRect();
  music.currentTime = ((e.clientX - rect.left) / rect.width) * music.duration;
};

function tryPlayMusic(){ music.play().catch(()=>{}); }

function typeWriter(text, element, speed=34){
  clearTimeout(typingTimer);
  element.textContent = "";
  let i = 0;
  function type(){
    if(i < text.length){
      element.textContent += text.charAt(i);
      i++;
      typingTimer = setTimeout(type, speed);
    }
  }
  type();
}

function renderLetter(){
  typeWriter(CONFIG.pesanSurat[letterIndex], letterText);
  letterProgress.textContent = "Pesan " + (letterIndex + 1) + " dari " + CONFIG.pesanSurat.length;
  nextLetterBtn.textContent = letterIndex === CONFIG.pesanSurat.length - 1 ? "Lihat Galeri" : "Lanjut";
}

function renderGallery(){
  gallery.innerHTML = "";
  CONFIG.foto.forEach((src,i)=>{
    const img = document.createElement("img");
    img.src = src + "?v=" + version;
    img.alt = "Foto " + (i+1);
    img.onclick = () => {
      lightboxImg.src = src + "?v=" + version;
      lightbox.style.display = "flex";
    };
    gallery.appendChild(img);
  });
}

function renderQuiz(){
  quizQuestion.textContent = CONFIG.kuis.pertanyaan;
  quizOptions.innerHTML = "";
  quizFeedback.textContent = "";
  CONFIG.kuis.pilihan.forEach((text,index)=>{
    const btn = document.createElement("button");
    btn.textContent = text;
    btn.onclick = () => {
      if(index === CONFIG.kuis.jawabanBenar){
        quizFeedback.textContent = CONFIG.kuis.pesanBenar;
        setTimeout(()=>showScreen("final"),1200);
      } else {
        quizFeedback.textContent = CONFIG.kuis.pesanSalah;
      }
    };
    quizOptions.appendChild(btn);
  });
}

coverTitle.textContent = CONFIG.judul;
coverSubtitle.textContent = CONFIG.subjudul;
finalTitle.textContent = CONFIG.penutupJudul;
finalMessage.textContent = CONFIG.penutupPesan;

openBtn.onclick = () => { tryPlayMusic(); renderLetter(); showScreen("letter"); };
nextLetterBtn.onclick = () => {
  if(letterIndex < CONFIG.pesanSurat.length - 1){
    letterIndex++;
    renderLetter();
  } else {
    renderGallery();
    showScreen("gallery");
  }
};
toQuizBtn.onclick = () => { renderQuiz(); showScreen("quiz"); };
closeLightbox.onclick = () => lightbox.style.display = "none";
lightbox.onclick = (e) => { if(e.target === lightbox) lightbox.style.display = "none"; };

function createHeart(){
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = "♥";
  heart.style.left = Math.random()*100 + "vw";
  heart.style.fontSize = (16+Math.random()*22) + "px";
  heart.style.animationDuration = (5+Math.random()*4) + "s";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),9000);
}
setInterval(createHeart,550);
</script>
</body>
</html>
